name: Feature Request
description: Suggest a new feature or enhancement for Avail
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Help us understand your idea by providing details below.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Need
      description: What problem would this feature solve?
      placeholder: "I'm trying to [goal] but currently [limitation/frustration]..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work?
      placeholder: Describe your ideal solution or feature behavior...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered other approaches?
      placeholder: Describe alternative solutions or workarounds you've tried...
    validations:
      required: false

  - type: checkboxes
    id: area
    attributes:
      label: Feature Area
      description: Which areas would this affect? (select all that apply)
      options:
        - label: Domain Search
        - label: WHOIS Data Display
        - label: TLD Management
        - label: User Interface/UX
        - label: Performance
        - label: API/Backend
        - label: Accessibility
        - label: Documentation

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Describe a specific scenario where this would help
      placeholder: |
        As a [role/user type], I want to [action] so that [benefit].

        Example workflow: When I'm checking [domains], I need [feature] because [reason].
    validations:
      required: false

  - type: textarea
    id: mockups
    attributes:
      label: Examples or Mockups
      description: Add mockups, screenshots, or examples from other tools
      placeholder: Drag and drop images or paste URLs here...

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Anything else that would help us understand this request?
      placeholder: Any other relevant information...
